plugins {
  id 'java'
}

group = 'com.jvibe'
version = '0.1.0-SNAPSHOT'

ext {
  jvibeJavaVersion = 21
  avajeInjectVersion = '12.5'
  avajeConfigVersion = '5.1'
  avajeJsonbVersion = '3.12'
  avajeSimpleLoggerVersion = '1.5'
  minaSshdVersion = '2.15.0'
  jakartaAnnotationVersion = '3.0.0'
  junitVersion = '5.13.4'
  mockitoVersion = '5.21.0'
}

subprojects {
  apply plugin: 'java'

  group = rootProject.group
  version = rootProject.version

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = jvibeJavaVersion
  }

  tasks.withType(Test).configureEach {
    useJUnitPlatform()
  }

  dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
  }

  configurations.configureEach {
    resolutionStrategy.force 'org.slf4j:slf4j-api:2.0.17'
    resolutionStrategy.failOnVersionConflict()
  }
}

tasks.register('jvibe', Exec) {
  group = 'application'
  description = 'Builds the GUI install distribution and launches the installed jvibe app.'
  dependsOn ':app-gui:installDist'

  executable = layout.projectDirectory.file(
      org.gradle.internal.os.OperatingSystem.current().isWindows()
          ? 'app-gui/build/install/jvibe/bin/jvibe.bat'
          : 'app-gui/build/install/jvibe/bin/jvibe').asFile
}
