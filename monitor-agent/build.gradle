plugins {
  id 'java-library'
}

dependencies {
  implementation project(':core')
  implementation "io.avaje:avaje-config:${avajeConfigVersion}"
  implementation "io.avaje:avaje-jsonb:${avajeJsonbVersion}"
  annotationProcessor "io.avaje:avaje-jsonb-generator:${avajeJsonbVersion}"
}

tasks.named('jar') {
  archiveBaseName = 'jvibe-monitor'
  manifest {
    attributes(
        'Premain-Class': 'com.jvibe.monitor.agent.JvibeMonitorAgent',
        'Agent-Class': 'com.jvibe.monitor.agent.JvibeMonitorAgent',
        'Can-Redefine-Classes': 'false',
        'Can-Retransform-Classes': 'false')
  }
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  from configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
}
