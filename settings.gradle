pluginManagement {
  repositories {
    gradlePluginPortal()
    mavenCentral()
  }
}

dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    mavenCentral()
    maven {
      url = uri('https://packages.jetbrains.team/maven/p/ij/intellij-dependencies')
    }
  }
}

rootProject.name = 'jvibe'

include 'core'
include 'testing'
include 'app-cli'
include 'app-gui'
