dependencies {
  implementation "io.avaje:avaje-inject:${avajeInjectVersion}"
  annotationProcessor "io.avaje:avaje-inject-generator:${avajeInjectVersion}"

  implementation "io.avaje:avaje-config:${avajeConfigVersion}"

  implementation "io.avaje:avaje-jsonb:${avajeJsonbVersion}"
  annotationProcessor "io.avaje:avaje-jsonb-generator:${avajeJsonbVersion}"

  implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
  implementation "jakarta.annotation:jakarta.annotation-api:${jakartaAnnotationVersion}"
  implementation "org.apache.sshd:sshd-core:${minaSshdVersion}"
  implementation "org.apache.sshd:sshd-sftp:${minaSshdVersion}"
  implementation "org.apache.sshd:sshd-putty:${minaSshdVersion}"
  implementation 'org.slf4j:slf4j-api:2.0.17'

  testAnnotationProcessor "io.avaje:avaje-inject-generator:${avajeInjectVersion}"
  testRuntimeOnly "io.avaje:avaje-simple-logger:${avajeSimpleLoggerVersion}"
}
