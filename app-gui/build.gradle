plugins {
  id 'application'
  id 'com.gradleup.shadow' version '9.6.1'
}

dependencies {
  implementation project(':core')
  implementation "io.avaje:avaje-inject:${avajeInjectVersion}"
  implementation "jakarta.annotation:jakarta.annotation-api:${jakartaAnnotationVersion}"
  implementation 'com.formdev:flatlaf:3.7.1'
  implementation 'com.formdev:flatlaf-intellij-themes:3.7.1'
  implementation 'org.jetbrains.jediterm:jediterm-core:3.66'
  implementation 'org.jetbrains.jediterm:jediterm-ui:3.66'
  implementation 'org.jetbrains.pty4j:pty4j:0.13.12'
  annotationProcessor "io.avaje:avaje-inject-generator:${avajeInjectVersion}"
  runtimeOnly "io.avaje:avaje-simple-logger:${avajeSimpleLoggerVersion}"
}

configurations.configureEach {
  resolutionStrategy.force 'org.jetbrains:annotations:24.0.1'
  resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
}

application {
  applicationName = 'jvibe'
  mainClass = 'com.jvibe.gui.JvibeGui'
  applicationDefaultJvmArgs = ['-Dapple.awt.application.name=JVibe']
}

// Runnable fat jar: java -jar app-gui/build/libs/jvb.jar
tasks.named('shadowJar') {
  archiveFileName = 'jvb.jar'
  // avaje-inject and avaje-jsonb discover each module's generated code through ServiceLoader,
  // so META-INF/services files must be merged; Shadow only merges duplicates it is allowed to see.
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
  mergeServiceFiles()
  exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

tasks.named('assemble') {
  dependsOn tasks.named('shadowJar')
}

tasks.register('jvibe', JavaExec) {
  group = 'application'
  description = 'Builds jvb.jar and launches the JVibe desktop app.'
  classpath = files(tasks.named('shadowJar').flatMap { it.archiveFile })
  mainClass = application.mainClass
  jvmArgs application.applicationDefaultJvmArgs
}
